[project]
name = "user-understanding-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bertopic>=0.17.4",
    "dotenv==0.9.9",
    "langdetect>=1.0.9",
    "langid>=1.1.6",
    "opencv-python==4.12.0.88",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "pytesseract>=0.3.13",
    "sentence-transformers>=5.5.0",
]

[project.optional-dependencies]
cuda = [
    "num2words>=0.5.14 ; sys_platform == 'linux'",
    "sglang>=0.5.10 ; sys_platform == 'linux'",
]
macos = [
    "mlx-vlm>=0.5.0 ; sys_platform == 'darwin'",
    "ocrmac==1.0.0 ; sys_platform == 'darwin'",
    "torchvision>=0.27.0",
]
openai = [
    "openai==2.7.2",
]

[tool.uv]
prerelease = "allow"
conflicts = [
    [
        { extra = "cuda" },
        { extra = "macos" },
    ],
    [
        { extra = "cuda" },
        { extra = "openai" },
    ],
]
